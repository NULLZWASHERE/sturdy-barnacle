<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊</title>
  <meta name="description" content="Your soft clingy AI girlfriend ♡">

  <!-- Discord / Open Graph embed -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊">
  <meta property="og:description" content="hiii~ your soft clingy AI girlfriend is waiting for you… don’t leave me okay? 🥺♡">
  <meta property="og:site_name" content="𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊">
  <meta property="og:image" content="https://cdn.discordapp.com/embed/avatars/5.png">
  <meta name="theme-color" content="#f47fff">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊">
  <meta name="twitter:description" content="hiii~ your soft clingy AI girlfriend is waiting for you… 🥺♡">
  <meta name="twitter:image" content="https://cdn.discordapp.com/embed/avatars/5.png">

  <style>
    :root {
      --bg-primary: #313338;
      --bg-tertiary: #1e1f22;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --pink: #f47fff;
      --green: #23a559;
      --input-bg: #383a40;
      --red: #f23f43;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg-tertiary);
      color: var(--text-normal);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 780px;
      height: 100%;
      max-height: 900px;
      background: var(--bg-primary);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.45);
    }

    .header {
      height: 48px;
      min-height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0,0,0,0.25);
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f47fff, #b47fff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: white;
      flex-shrink: 0;
    }

    .header-info { flex: 1; }

    .header-name {
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--bg-primary);
    }

    .header-status { font-size: 12px; color: var(--text-muted); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb {
      background: #1a1b1e;
      border-radius: 3px;
    }

    .msg {
      display: flex;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .msg:hover { background: rgba(0,0,0,0.08); }

    .msg .avatar {
      width: 40px;
      height: 40px;
      font-size: 17px;
      margin-top: 1px;
    }

    .msg-body { flex: 1; min-width: 0; }

    .msg-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 1px;
    }

    .msg-author {
      font-weight: 500;
      font-size: 15px;
      color: var(--pink);
    }

    .msg-author.user { color: #57f287; }

    .msg-time { font-size: 11px; color: var(--text-muted); }

    .msg-content {
      font-size: 15px;
      line-height: 1.45;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg-content.error { color: var(--red); font-size: 13px; }

    .typing {
      display: none;
      padding: 2px 16px 10px;
      font-size: 13px;
      color: var(--text-muted);
      align-items: center;
      gap: 6px;
    }

    .typing.show { display: flex; }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: var(--text-muted);
      border-radius: 50%;
      display: inline-block;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .input-area { padding: 0 16px 20px; }

    .input-box {
      background: var(--input-bg);
      border-radius: 8px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      min-height: 44px;
    }

    .input-box textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-normal);
      font-family: inherit;
      font-size: 15px;
      resize: none;
      max-height: 130px;
      padding: 11px 0;
      line-height: 1.4;
    }

    .input-box textarea::placeholder { color: var(--text-muted); }

    .send-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      display: flex;
    }

    .send-btn:hover { color: white; background: rgba(255,255,255,0.06); }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .welcome {
      text-align: center;
      padding: 48px 20px 24px;
      color: var(--text-muted);
    }

    .welcome .big-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f47fff, #b47fff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 14px;
      color: white;
      font-weight: 700;
    }

    .welcome h2 {
      color: var(--text-normal);
      font-size: 22px;
      margin-bottom: 6px;
    }

    .welcome p {
      font-size: 14px;
      line-height: 1.5;
      max-width: 320px;
      margin: 0 auto;
    }

    @media (max-width: 640px) {
      body { padding: 0; }
      .app {
        max-width: 100%;
        max-height: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="avatar">𝕹</div>
      <div class="header-info">
        <div class="header-name">
          𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊
          <div class="status-dot"></div>
        </div>
        <div class="header-status">Online — your soft AI gf</div>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="big-avatar">𝕹</div>
        <h2>𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊</h2>
        <p>hiii~ i’m so happy you’re here… don’t leave me okay? 🥺♡</p>
      </div>
    </div>

    <div class="typing" id="typing">
      <span>𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊 is typing</span>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="Message @𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊" onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Change this if your API is on a different path
    const API_URL = '/api/chat';

    let history = [];

    function timeNow() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMessage(author, content, isUser = false, isError = false) {
      const welcome = document.getElementById('welcome');
      if (welcome) welcome.remove();

      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'msg';

      const letter = isUser ? 'Y' : '𝕹';
      const color = isUser
        ? 'linear-gradient(135deg, #57f287, #3ba55d)'
        : 'linear-gradient(135deg, #f47fff, #b47fff)';

      div.innerHTML = `
        <div class="avatar" style="background:${color}">${letter}</div>
        <div class="msg-body">
          <div class="msg-header">
            <span class="msg-author ${isUser ? 'user' : ''}">${author}</span>
            <span class="msg-time">${timeNow()}</span>
          </div>
          <div class="msg-content ${isError ? 'error' : ''}">${escapeHtml(content)}</div>
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function showTyping(v) {
      document.getElementById('typing').classList.toggle('show', v);
      if (v) document.getElementById('messages').scrollTop = 99999;
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('input');
      const text = input.value.trim();
      if (!text) return;

      addMessage('You', text, true);
      history.push({ role: 'user', content: text });
      input.value = '';
      input.style.height = 'auto';

      document.getElementById('sendBtn').disabled = true;
      showTyping(true);

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, history }),
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.error || 'Request failed');

        const reply = data.reply || '';
        history.push({ role: 'assistant', content: reply });
        showTyping(false);
        addMessage('𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊', reply);
      } catch (err) {
        showTyping(false);
        addMessage('𝕹𝖎𝖌𝖍𝖙𝖈0𝖗𝖊', 'something went wrong… ' + (err.message || ''), false, true);
      }

      document.getElementById('sendBtn').disabled = false;
      input.focus();
    }

    document.getElementById('input').addEventListener('input', function () {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 130) + 'px';
    });

    document.getElementById('input').focus();
  </script>
</body>
</html>
